name: Deploy Angular to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # CORRECTION 1 : Le nom du projet dans angular.json est "task-wheel"
      # Le dossier de sortie sera donc dist/task-wheel/browser
      - name: Build with Angular
        run: npm run build -- --base-href="/Task-wheel-DZ/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # CORRECTION 2 : Ajuster le chemin pour correspondre au nom réel du projet
          path: 'dist/task-wheel/browser'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
